<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agent-replay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #161920;
      --surface2: #1e2230;
      --border: #2a2e3d;
      --text: #e2e5f0;
      --muted: #6b7280;
      --accent: #6366f1;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --blue: #3b82f6;
      --purple: #a855f7;
      --orange: #f97316;
      font-size: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 16px; font-weight: 700; color: var(--accent); }
    .logo span { color: var(--muted); font-weight: 400; }

    /* ── Metrics bar ─────────────────────────── */
    .metrics {
      display: flex;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .metric {
      background: var(--surface);
      padding: 14px 20px;
      flex: 1;
      min-width: 120px;
    }
    .metric-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
    .metric-value { font-size: 22px; font-weight: 700; color: var(--text); }
    .metric-value.warn { color: var(--yellow); }
    .metric-value.err  { color: var(--red); }
    .metric-value.ok   { color: var(--green); }

    /* ── Controls ────────────────────────────── */
    .controls {
      display: flex;
      gap: 8px;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      align-items: center;
    }
    .search-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 6px 12px;
      width: 240px;
      outline: none;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--accent); }

    .filter-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      padding: 6px 12px;
      transition: all .15s;
      user-select: none;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .controls-right { margin-left: auto; display: flex; gap: 8px; }

    /* ── Timeline ────────────────────────────── */
    .timeline {
      flex: 1;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    .step-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color .15s;
    }
    .step-card:hover { border-color: #3a3f55; }
    .step-card.status-error  { border-left: 3px solid var(--red); }
    .step-card.status-loop   { border-left: 3px solid var(--yellow); }
    .step-card.status-success { border-left: 3px solid transparent; }

    .step-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
    }
    .step-header:hover { background: rgba(255,255,255,.02); }

    .step-num {
      color: var(--muted);
      font-size: 11px;
      width: 28px;
      text-align: right;
      flex-shrink: 0;
    }

    .role-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .role-system    { background: #1e2040; color: var(--accent); }
    .role-user      { background: #1a2d1a; color: var(--green); }
    .role-assistant { background: #2a1a40; color: var(--purple); }
    .role-tool      { background: #1a2a3a; color: var(--blue); }

    .step-preview {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--text);
      font-size: 13px;
    }

    .step-meta {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
      align-items: center;
    }
    .meta-item { font-size: 11px; color: var(--muted); }
    .meta-item span { color: var(--text); }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-success { background: var(--green); }
    .dot-error   { background: var(--red); }
    .dot-loop    { background: var(--yellow); }

    .chevron { color: var(--muted); font-size: 10px; transition: transform .2s; }
    .chevron.open { transform: rotate(90deg); }

    /* ── Step body ───────────────────────────── */
    .step-body { display: none; border-top: 1px solid var(--border); }
    .step-body.open { display: block; }

    .step-content {
      padding: 12px 14px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      border-bottom: 1px solid var(--border);
    }
    .step-content:last-child { border-bottom: none; }

    .tool-section { padding: 12px 14px; }
    .tool-header {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }

    .tool-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .tool-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
    }
    .tool-card-header:hover { background: rgba(255,255,255,.02); }
    .tool-name { font-size: 12px; font-weight: 700; color: var(--blue); }
    .tool-id { font-size: 11px; color: var(--muted); }
    .tool-body { display: none; border-top: 1px solid var(--border); }
    .tool-body.open { display: block; }

    .json-block {
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
      overflow-x: auto;
    }
    .json-key { color: #7dd3fc; }
    .json-str { color: #86efac; }
    .json-num { color: #fbbf24; }
    .json-bool { color: #f472b6; }
    .json-null { color: var(--muted); }
    .json-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 6px 12px 0;
    }

    /* ── Empty state ─────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }

    /* ── Loading ─────────────────────────────── */
    .loading { text-align: center; padding: 60px; color: var(--muted); }

    /* ── Scrollbar ───────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">agent-replay <span>v0.1.0</span></div>
</header>

<div class="metrics" id="metrics">
  <div class="metric"><div class="metric-label">Total Steps</div><div class="metric-value" id="m-steps">—</div></div>
  <div class="metric"><div class="metric-label">Total Tokens</div><div class="metric-value" id="m-tokens">—</div></div>
  <div class="metric"><div class="metric-label">Total Latency</div><div class="metric-value" id="m-latency">—</div></div>
  <div class="metric"><div class="metric-label">Tool Calls</div><div class="metric-value" id="m-tools">—</div></div>
  <div class="metric"><div class="metric-label">Loop Warnings</div><div class="metric-value warn" id="m-loops">—</div></div>
  <div class="metric"><div class="metric-label">Errors</div><div class="metric-value err" id="m-errors">—</div></div>
</div>

<div class="controls">
  <input class="search-input" id="search" type="text" placeholder="Search content..." oninput="applyFilters()" />

  <button class="filter-btn active" data-role="all"    onclick="setRole(this)">All</button>
  <button class="filter-btn"        data-role="system"    onclick="setRole(this)">System</button>
  <button class="filter-btn"        data-role="user"      onclick="setRole(this)">User</button>
  <button class="filter-btn"        data-role="assistant" onclick="setRole(this)">Assistant</button>
  <button class="filter-btn"        data-role="tool"      onclick="setRole(this)">Tool</button>

  <div class="controls-right">
    <button class="filter-btn" id="toggle-issues" onclick="toggleIssues()">Show Issues Only</button>
  </div>
</div>

<div class="timeline" id="timeline">
  <div class="loading">Loading trace...</div>
</div>

<script>
  let allSteps = [];
  let activeRole = 'all';
  let issuesOnly = false;

  // ── Fetch trace ────────────────────────────────────────────────────────────
  fetch('/api/trace')
    .then(r => r.json())
    .then(({ steps, summary }) => {
      allSteps = steps;
      renderMetrics(summary);
      renderSteps(steps);
    })
    .catch(err => {
      document.getElementById('timeline').innerHTML =
        `<div class="empty-state"><h3>Failed to load trace</h3><p>${err.message}</p></div>`;
    });

  // ── Metrics ────────────────────────────────────────────────────────────────
  function renderMetrics(s) {
    document.getElementById('m-steps').textContent   = s.total_steps;
    document.getElementById('m-tokens').textContent  = s.total_tokens.toLocaleString();
    document.getElementById('m-latency').textContent = s.total_latency_ms >= 1000
      ? (s.total_latency_ms / 1000).toFixed(2) + 's'
      : s.total_latency_ms + 'ms';
    document.getElementById('m-tools').textContent   = s.tool_execution_count;
    document.getElementById('m-loops').textContent   = s.loop_warnings;
    document.getElementById('m-errors').textContent  = s.error_count;
  }

  // ── Filtering ──────────────────────────────────────────────────────────────
  function setRole(btn) {
    document.querySelectorAll('[data-role]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeRole = btn.dataset.role;
    applyFilters();
  }

  function toggleIssues() {
    issuesOnly = !issuesOnly;
    document.getElementById('toggle-issues').classList.toggle('active', issuesOnly);
    applyFilters();
  }

  function applyFilters() {
    const q = document.getElementById('search').value.toLowerCase();
    const visible = allSteps.filter(step => {
      if (activeRole !== 'all' && step.role !== activeRole) return false;
      if (issuesOnly && step.status === 'success') return false;
      if (q && !step.content.toLowerCase().includes(q) &&
          !step.role.includes(q)) return false;
      return true;
    });
    renderSteps(visible);
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderSteps(steps) {
    const tl = document.getElementById('timeline');
    if (!steps.length) {
      tl.innerHTML = '<div class="empty-state"><h3>No matching steps</h3><p>Adjust the filters or search term.</p></div>';
      return;
    }
    tl.innerHTML = steps.map(renderStep).join('');
  }

  function roleName(role) {
    return { system: 'System', user: 'User Input', assistant: 'LLM Response', tool: 'Tool Call' }[role] || role;
  }

  function fmtTime(ts) {
    try { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 }); }
    catch { return ts; }
  }

  function renderStep(step) {
    const id = `step-${step.step}`;
    const bodyId = `body-${step.step}`;
    const chevId = `chev-${step.step}`;
    const hasTool = step.tool_calls && step.tool_calls.length > 0;
    const preview = step.content.replace(/\n/g, ' ').slice(0, 120) + (step.content.length > 120 ? '…' : '');

    const metaHtml = [
      step.latency_ms !== undefined ? `<span class="meta-item">${step.latency_ms}ms</span>` : '',
      step.tokens !== undefined ? `<span class="meta-item">${step.tokens} tok</span>` : '',
      hasTool ? `<span class="meta-item">${step.tool_calls.length} tool${step.tool_calls.length > 1 ? 's' : ''}</span>` : '',
    ].filter(Boolean).join('');

    const toolsHtml = hasTool ? `
      <div class="tool-section">
        <div class="tool-header">Tool Calls</div>
        ${step.tool_calls.map((tc, ti) => renderToolCall(step.step, ti, tc)).join('')}
      </div>` : '';

    return `
<div class="step-card status-${step.status}" id="${id}">
  <div class="step-header" onclick="toggleStep('${bodyId}','${chevId}')">
    <span class="step-num">#${step.step}</span>
    <span class="role-badge role-${step.role}">${roleName(step.role)}</span>
    <span class="step-preview">${escHtml(preview)}</span>
    <div class="step-meta">
      ${metaHtml}
      <span class="meta-item">${fmtTime(step.timestamp)}</span>
      <div class="status-dot dot-${step.status}" title="${step.status}"></div>
      <span class="chevron" id="${chevId}">▶</span>
    </div>
  </div>
  <div class="step-body" id="${bodyId}">
    <div class="step-content">${escHtml(step.content)}</div>
    ${toolsHtml}
  </div>
</div>`;
  }

  function renderToolCall(stepId, ti, tc) {
    const bodyId = `tc-${stepId}-${ti}`;
    const chevId = `tchev-${stepId}-${ti}`;
    const inputJson = syntaxHighlight(JSON.stringify(tc.input, null, 2));
    const outputJson = tc.output !== undefined && tc.output !== null
      ? syntaxHighlight(JSON.stringify(tc.output, null, 2))
      : null;

    return `
<div class="tool-card">
  <div class="tool-card-header" onclick="toggleStep('${bodyId}','${chevId}')">
    <span class="tool-name">${escHtml(tc.name)}</span>
    <span class="tool-id">${escHtml(tc.id)}</span>
    <span class="chevron" id="${chevId}" style="margin-left:auto">▶</span>
  </div>
  <div class="tool-body" id="${bodyId}">
    <div class="json-label">Input</div>
    <div class="json-block">${inputJson}</div>
    ${outputJson ? `<div class="json-label">Output</div><div class="json-block">${outputJson}</div>` : ''}
  </div>
</div>`;
  }

  // ── Toggle ─────────────────────────────────────────────────────────────────
  function toggleStep(bodyId, chevId) {
    const body = document.getElementById(bodyId);
    const chev = document.getElementById(chevId);
    if (!body) return;
    const isOpen = body.classList.toggle('open');
    if (chev) chev.classList.toggle('open', isOpen);
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function syntaxHighlight(json) {
    return escHtml(json).replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      match => {
        let cls = 'json-num';
        if (/^"/.test(match)) {
          cls = /:$/.test(match) ? 'json-key' : 'json-str';
        } else if (/true|false/.test(match)) {
          cls = 'json-bool';
        } else if (/null/.test(match)) {
          cls = 'json-null';
        }
        return `<span class="${cls}">${match}</span>`;
      }
    );
  }
</script>
</body>
</html>
